<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0f0f1a" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <title>idol — 偶像生活模拟器</title>
  <style>
/* ===== 基础 ===== */
:root {
  --phone-w: 390px;
  --phone-h: 844px;
  --phone-radius: 44px;
  color-scheme: dark;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: #1a1a2e;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  min-height: 100dvh;
  -webkit-tap-highlight-color: transparent;
  user-select: none; -webkit-user-select: none;
}

/* ===== 偶像设定页 ===== */
.setup-screen {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: radial-gradient(ellipse at 50% 0%, #1e1b4b 0%, #0f0f1a 60%, #000 100%);
  display: flex;
  align-items: safe center;
  justify-content: safe center;
  padding: 16px;
  transition: opacity .5s ease, transform .5s ease;
}
.setup-screen.hidden {
  opacity: 0;
  pointer-events: none;
  transform: scale(1.05);
}

.setup-card {
  width: 100%;
  max-width: 360px;
  max-height: 90vh;
  max-height: 90dvh;
  overflow-y: auto;
  background: rgba(255,255,255,.04);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 28px;
  padding: 32px 24px 28px;
  box-shadow: 0 25px 60px rgba(0,0,0,.5);
  -webkit-overflow-scrolling: touch;
  margin: 0 auto;
}

.setup-header {
  text-align: center;
  margin-bottom: 24px;
  width: 100%;
}

/* App 图标 */
.app-logo-wrap {
  display: flex;
  justify-content: center;
  margin-bottom: 20px;
}
.app-logo {
  width: 100px;
  height: 100px;
  filter: drop-shadow(0 8px 24px rgba(100,80,180,.35));
}

.setup-header h1 {
  font-size: 22px;
  font-weight: 700;
  color: #fff;
  margin: 0 0 6px;
}
.setup-header p {
  font-size: 13px;
  color: rgba(255,255,255,.4);
  line-height: 1.6;
  margin: 0;
}

.setup-form {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.form-row {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.form-row-split {
  flex-direction: row;
  gap: 12px;
}
.form-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.form-label {
  font-size: 12px;
  font-weight: 600;
  color: rgba(255,255,255,.55);
  text-transform: uppercase;
  letter-spacing: .5px;
}
.form-label .required { color: #FF6BA6; }

.form-input {
  width: 100%;
  padding: 12px 14px;
  border-radius: 14px;
  border: 1px solid rgba(255,255,255,.08);
  background: rgba(255,255,255,.04);
  color: #fff;
  font-size: 15px;
  outline: none;
  transition: border-color .2s, background .2s;
  font-family: inherit;
}
.form-input:focus {
  border-color: rgba(255,107,166,.4);
  background: rgba(255,255,255,.06);
}
.form-input::placeholder { color: rgba(255,255,255,.18); }

/* 折叠区 */
.setup-section {
  margin-top: 4px;
  border: 1px solid rgba(255,255,255,.06);
  border-radius: 16px;
  overflow: hidden;
}
.setup-section-title {
  padding: 12px 16px;
  font-size: 13px;
  font-weight: 600;
  color: rgba(255,255,255,.55);
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: background .15s;
}
.setup-section-title:hover { background: rgba(255,255,255,.03); }
.toggle-arrow { font-size: 18px; transition: transform .25s; }
.setup-section.open .toggle-arrow { transform: rotate(90deg); }
.setup-section-body {
  display: none;
  padding: 0 16px 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.setup-section:not(.open) .setup-section-body { display: none; }

/* 选项芯片 */
.option-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.opt-chip {
  padding: 9px 16px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  border: 1px solid rgba(255,255,255,.1);
  background: rgba(255,255,255,.03);
  color: rgba(255,255,255,.5);
  transition: all .18s;
}
.opt-chip:hover { background: rgba(255,255,255,.08); color: rgba(255,255,255,.7); }
.opt-chip.active {
  background: rgba(255,255,255,.12);
  border-color: rgba(255,255,255,.25);
  color: #fff;
  font-weight: 600;
  box-shadow: 0 0 12px rgba(255,107,166,.15);
}

/* 进入按钮 */
.setup-btn {
  width: 100%;
  margin-top: 24px;
  padding: 14px;
  border: none;
  border-radius: 16px;
  background: linear-gradient(135deg, #FF6BA6, #C44569);
  color: #fff;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: transform .15s, box-shadow .15s;
  letter-spacing: .5px;
  box-shadow: 0 8px 30px rgba(196,69,105,.3);
}
.setup-btn:hover { transform: translateY(-1px); box-shadow: 0 12px 36px rgba(196,69,105,.4); }
.setup-btn:active { transform: translateY(0); }
.setup-btn:disabled {
  opacity: .4;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}

.setup-hint {
  text-align: center;
  font-size: 11px;
  color: rgba(255,255,255,.25);
  margin-top: 12px;
  min-height: 16px;
}

/* ===== 安装引导条 ===== */
.install-banner {
  width: 100%;
  max-width: 360px;
  margin-top: 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  background: rgba(255,255,255,.05);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 20px;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  transition: opacity .3s, transform .3s;
}
.install-banner.dismissed {
  opacity: 0;
  pointer-events: none;
  transform: translateY(10px);
}
.install-banner-icon {
  flex-shrink: 0;
}
.install-banner-icon svg {
  width: 48px;
  height: 48px;
}
.install-banner-text {
  flex: 1;
  min-width: 0;
}
.install-banner-title {
  font-size: 14px;
  font-weight: 600;
  color: #fff;
}
.install-banner-desc {
  font-size: 11px;
  color: rgba(255,255,255,.4);
  margin-top: 2px;
}
.install-banner-btn {
  padding: 9px 18px;
  border-radius: 18px;
  border: none;
  background: linear-gradient(135deg, #FF6BA6, #C44569);
  color: #fff;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  flex-shrink: 0;
  transition: transform .12s, box-shadow .12s;
  min-width: 0;
  box-shadow: 0 4px 14px rgba(196,69,105,.3);
}
.install-banner-btn:hover { transform: translateY(-1px); }
.install-banner-btn:active { transform: translateY(0); }
.install-banner-btn.ios-guide {
  background: rgba(255,255,255,.1);
  color: rgba(255,255,255,.6);
  box-shadow: none;
  font-weight: 500;
}

/* ---- 全局安装引导条 ---- */
.global-install-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 999;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 16px;
  padding-bottom: calc(14px + env(safe-area-inset-bottom, 8px));
  background: #14142d;
  border-top: 1px solid rgba(255,255,255,.15);
  box-shadow: 0 -4px 20px rgba(0,0,0,.5);
  transition: opacity .3s, transform .3s;
}
.global-install-bar.dismissed {
  opacity: 0;
  pointer-events: none;
  transform: translateY(100%);
}
.gib-icon { font-size: 28px; flex-shrink: 0; }
.gib-text { flex: 1; font-size: 13px; font-weight: 500; color: rgba(255,255,255,.85); min-width: 0; }
.gib-btn {
  padding: 8px 16px;
  border-radius: 20px;
  border: none;
  background: linear-gradient(135deg, #FF6BA6, #C44569);
  color: #fff;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  flex-shrink: 0;
  box-shadow: 0 4px 14px rgba(196,69,105,.3);
  min-width: 0;
}
.gib-btn:active { transform: scale(.95); }

/* ---- 首页顶部行 ---- */
.home-top-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 320px;
  margin-bottom: 8px;
  padding: 0 4px;
}
.home-greeting {
  color: rgba(255,255,255,.7);
  font-size: 14px;
  font-weight: 500;
}
.home-settings-btn {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: none;
  background: rgba(255,255,255,.08);
  color: rgba(255,255,255,.5);
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background .15s, color .15s;
  min-width: 0;
  padding: 0;
}
.home-settings-btn:hover { background: rgba(255,255,255,.15); color: #fff; }

/* 手机容器初始隐藏 */
#phoneContainer { display: none; }
#phoneContainer.ready { display: flex; }

/* ===== 手机外壳 ===== */
.phone-container {
  width: var(--phone-w);
  height: var(--phone-h);
  background: #000;
  border-radius: var(--phone-radius);
  position: relative;
  overflow: hidden;
  box-shadow:
    0 0 0 3px #1a1a1a, 0 0 0 6px #222, 0 0 0 8px #111, 0 20px 60px rgba(0,0,0,.5);
  display: flex;
  flex-direction: column;
}

/* ===== 状态栏 ===== */
.status-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 28px 6px 28px;
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: .5px;
  z-index: 30;
  position: relative;
  pointer-events: none;
}

/* ===== 主屏幕 ===== */
.home-screen {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: linear-gradient(180deg, #1c1c1e 0%, #000 100%);
  padding-bottom: 30px;
  transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s ease;
}
.home-screen.hidden { transform: scale(.92); opacity: 0; pointer-events: none; }

.folder-label { color: #fff; font-size: 20px; font-weight: 600; margin-bottom: 16px; letter-spacing: .5px; }

.folder-area {
  background: rgba(255,255,255,.08);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-radius: 28px;
  padding: 24px 20px 20px 20px;
  width: 320px;
}

.app-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px 16px;
}

.app-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  transition: transform .15s ease;
}
.app-item:active { transform: scale(.88); }

.app-icon {
  position: relative;
  width: 68px; height: 68px;
  border-radius: 17px;
  overflow: hidden;
  box-shadow: 0 4px 12px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.15);
}
.icon-svg { display: block; width: 100%; height: 100%; }

.app-name {
  color: #fff; font-size: 11px; font-weight: 500; letter-spacing: .2px;
  text-align: center; max-width: 72px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* 桌面角标 */
.app-badge {
  position: absolute;
  top: -4px; right: -4px;
  min-width: 18px; height: 18px; line-height: 18px;
  background: #ff3b30; color: #fff;
  font-size: 10px; font-weight: 700; text-align: center;
  border-radius: 9px; padding: 0 5px;
  z-index: 2;
  opacity: 0; transform: scale(.6);
  transition: opacity .2s, transform .2s;
  pointer-events: none;
}
.app-badge.show {
  opacity: 1; transform: scale(1);
}
.app-badge.pulse {
  animation: badgePop .4s ease;
}
@keyframes badgePop {
  0% { transform: scale(1); }
  50% { transform: scale(1.3); }
  100% { transform: scale(1); }
}

.app-icon.kakaotalk { background: #FEE500; }
.app-icon.instagram  { background: linear-gradient(135deg, #FCAF45, #E1306C, #833AB4, #405DE6); }
.app-icon.wechat     { background: #2BBF6A; }
.app-icon.twitter    { background: #000; }
.app-icon.bubble     { background: linear-gradient(135deg, #FF85B3, #FF6BA6, #C44569); }

.home-indicator {
  width: 134px; height: 5px; background: rgba(255,255,255,.35);
  border-radius: 3px; position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
}

/* =============================================
   应用视图（打开 App 后）
   ============================================= */
.app-view {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  display: flex; flex-direction: column;
  background: #000;
  transform: translateX(100%);
  transition: transform .35s cubic-bezier(.4,0,.2,1);
  border-radius: var(--phone-radius);
  overflow: hidden;
  z-index: 20;
  padding-top: 50px;
}
.app-view.active { transform: translateX(0); }

/* ---- 导航栏 ---- */
.app-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 8px 0 12px;
  height: 46px;
  flex-shrink: 0;
  border-bottom: 1px solid rgba(255,255,255,.08);
}

.nav-back {
  background: none; border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  width: 36px; height: 36px; border-radius: 50%;
  color: inherit; font-size: 28px; line-height: 1; font-weight: 300;
  transition: background .15s;
  min-width: 0; padding: 0;
}
.nav-back:hover { background: rgba(255,255,255,.1); }

.nav-title {
  font-size: 17px; font-weight: 600;
  position: absolute; left: 50%; transform: translateX(-50%);
  pointer-events: none;
  max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

.nav-action {
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; opacity: .7;
}

/* ---- 内容区 ---- */
.app-content {
  flex: 1;
  overflow: hidden;
  position: relative;
}

.screen {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  transition: opacity .2s ease, transform .2s ease;
}
.screen.hidden { opacity: 0; pointer-events: none; transform: translateY(4px); }

/* ---- 聊天列表 ---- */
.chatlist-scroll, .feed-scroll {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

.chatlist-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  cursor: pointer;
  transition: background .12s;
  border-bottom: 1px solid rgba(255,255,255,.04);
}
.chatlist-item:hover { background: rgba(255,255,255,.03); }
.chatlist-item:active { background: rgba(255,255,255,.06); }

.chatlist-avatar {
  width: 48px; height: 48px;
  border-radius: 50%;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 700; color: #fff;
  overflow: hidden;
}
.chatlist-avatar-portrait {
  border-radius: 8px;
  background: transparent !important;
}
.chatlist-avatar-portrait svg {
  width: 100%; height: 100%; display: block;
}
.chatlist-info { flex: 1; min-width: 0; }
.chatlist-name { font-size: 15px; font-weight: 600; margin-bottom: 3px; }
.chatlist-preview {
  font-size: 13px; opacity: .55;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.chatlist-meta { text-align: right; flex-shrink: 0; }
.chatlist-time { font-size: 11px; opacity: .4; margin-bottom: 4px; }
.chatlist-badge {
  display: inline-block;
  min-width: 18px; height: 18px; line-height: 18px;
  background: #ff3b30; color: #fff;
  font-size: 11px; font-weight: 600; text-align: center;
  border-radius: 9px; padding: 0 5px;
}

/* ---- 动态/朋友圈 ---- */
.feed-item {
  border-bottom: 1px solid rgba(255,255,255,.05);
  animation: fadeUp .3s ease;
}
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.feed-header {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 16px 8px;
}
.feed-avatar {
  width: 40px; height: 40px; border-radius: 50%;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 700; color: #fff;
  overflow: hidden;
}
.feed-avatar-portrait {
  border-radius: 7px;
  background: transparent !important;
}
.feed-avatar-portrait svg {
  width: 100%; height: 100%; display: block;
}
.feed-user { font-size: 14px; font-weight: 600; }
.feed-time { font-size: 11px; opacity: .4; margin-top: 2px; }

.feed-body {
  padding: 0 16px 12px;
  font-size: 14px; line-height: 1.6;
}

.feed-image {
  margin: 0 16px 12px;
  height: 180px;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 32px;
  overflow: hidden;
}

.feed-actions {
  display: flex; gap: 20px;
  padding: 4px 16px 14px;
  font-size: 12px; opacity: .5;
}

/* 评论区 */
.feed-comments {
  padding: 0 16px 12px;
  border-top: 1px solid rgba(255,255,255,.04);
  margin: 0 12px;
}
.feed-comments.hidden { display: none; }

.comment-item {
  padding: 6px 0;
  font-size: 12px;
  line-height: 1.5;
  border-bottom: 1px solid rgba(255,255,255,.02);
}
.comment-reply {
  padding-left: 16px;
  opacity: .8;
}
.comment-negative {
  opacity: .45;
}
.comment-user {
  font-weight: 600;
  color: rgba(255,255,255,.5);
  margin-right: 6px;
}
.comment-text { color: rgba(255,255,255,.75); }
.comment-likes {
  font-size: 10px;
  opacity: .4;
  margin-left: 8px;
  cursor: default;
}
.comment-more {
  padding: 8px 0 4px;
  font-size: 11px;
  color: rgba(255,255,255,.25);
  cursor: pointer;
}

/* 私密平台好友互动 */
.friend-likes {
  padding: 4px 0;
  font-size: 12px;
  color: rgba(255,255,255,.5);
}
.friend-comments {
  padding: 4px 0;
  margin-top: 2px;
  border-top: 1px solid rgba(255,255,255,.04);
}
.fc-item {
  font-size: 12px;
  line-height: 1.7;
  color: rgba(255,255,255,.65);
}
.fc-item b {
  color: rgba(255,255,255,.5);
  font-weight: 600;
  margin-right: 2px;
}

/* WeChat 朋友圈风格调整 */
.app-view.theme-wechat .feed-item {
  padding: 0 0 8px 0;
}
.app-view.theme-wechat .feed-user {
  color: #4876FF;
}
.app-view.theme-wechat .friend-likes {
  color: rgba(255,255,255,.35);
}
.app-view.theme-wechat .fc-item b {
  color: #4876FF;
}

/* KakaoTalk 动态风格调整 */
.app-view.theme-kakaotalk .feed-item {
  background: #fff;
  margin: 0 0 8px 0;
  border-radius: 12px;
  border-bottom: none;
}
.app-view.theme-kakaotalk .friend-likes {
  color: #666;
}
.app-view.theme-kakaotalk .fc-item {
  color: #333;
}
.app-view.theme-kakaotalk .fc-item b {
  color: #555;
}
.app-view.theme-kakaotalk .feed-user {
  color: #191919;
}
.app-view.theme-kakaotalk .feed-body {
  color: #333;
}

/* ---- 对话页 ---- */
.conv-messages {
  flex: 1;
  overflow-y: auto;
  padding: 12px 14px;
  display: flex; flex-direction: column;
  gap: 8px;
  -webkit-overflow-scrolling: touch;
}

.conv-date-divider {
  text-align: center;
  font-size: 11px; opacity: .35;
  padding: 8px 0;
}

.conv-msg {
  max-width: 78%;
  padding: 9px 13px;
  border-radius: 17px;
  font-size: 14.5px;
  line-height: 1.5;
  word-break: break-word;
  animation: msgIn .25s ease-out;
  position: relative;
}
@keyframes msgIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

.conv-msg.from { align-self: flex-start; border-bottom-left-radius: 5px; }
.conv-msg.to   { align-self: flex-end;   border-bottom-right-radius: 5px; }

/* 翻译按钮 */
.msg-translate-btn {
  display: block;
  margin-top: 5px;

/* ===== 发布弹窗 ===== */
.compose-overlay {
  position: fixed;
  inset: 0;
  z-index: 500;
  background: rgba(0,0,0,.7);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  transition: opacity .25s ease;
}
.compose-overlay.hidden { opacity: 0; pointer-events: none; }

.compose-sheet {
  width: 100%;
  max-width: 420px;
  max-height: 90vh;
  background: #1a1a2e;
  border-radius: 20px 20px 0 0;
  display: flex;
  flex-direction: column;
  animation: sheetUp .3s ease;
  overflow: hidden;
}
@keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

.compose-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  border-bottom: 1px solid rgba(255,255,255,.06);
}
.compose-cancel {
  background: none; border: none; color: rgba(255,255,255,.6);
  font-size: 15px; cursor: pointer; padding: 4px 8px;
}
.compose-title { font-size: 16px; font-weight: 600; color: #fff; }
.compose-submit {
  background: linear-gradient(135deg, #FF6BA6, #C44569);
  border: none; border-radius: 18px; padding: 7px 18px;
  color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
  transition: opacity .15s;
}
.compose-submit:disabled { opacity: .35; cursor: not-allowed; }

.compose-text {
  width: 100%;
  min-height: 120px;
  padding: 16px;
  border: none; background: transparent;
  color: #fff; font-size: 15px; line-height: 1.6;
  resize: vertical; outline: none; font-family: inherit;
}
.compose-text::placeholder { color: rgba(255,255,255,.25); }

.compose-image-area { padding: 0 16px 12px; }
.compose-add-img {
  display: flex; align-items: center; gap: 8px;
  padding: 12px 16px; border-radius: 14px;
  border: 1px dashed rgba(255,255,255,.2);
  cursor: pointer; color: rgba(255,255,255,.4);
  font-size: 14px; transition: border-color .15s;
}
.compose-add-img:hover { border-color: rgba(255,255,255,.4); }
.add-img-icon { font-size: 20px; }

.compose-preview {
  position: relative;
  margin: 0 16px 12px;
  border-radius: 14px;
  overflow: hidden;
}
.compose-preview img {
  width: 100%;
  max-height: 260px;
  object-fit: cover;
  display: block;
  border-radius: 14px;
}
.compose-remove-img {
  position: absolute;
  top: 8px; right: 8px;
  width: 28px; height: 28px; border-radius: 50%;
  border: none; background: rgba(0,0,0,.7);
  color: #fff; font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}

/* =============================================
   响应式
   ============================================= */
@media (max-width: 500px), (max-height: 700px) {
  body { align-items: stretch; background: #000; }
  .phone-container {
    width: 100vw; height: 100vh; height: 100dvh;
    border-radius: 0; box-shadow: none;
  }

  .conv-input-bar { padding-bottom: calc(10px + env(safe-area-inset-bottom, 8px)); }
  .app-tabs { padding-bottom: env(safe-area-inset-bottom, 0); height: calc(50px + env(safe-area-inset-bottom, 0)); }
}

@media (min-width: 501px) and (max-width: 420px) {

// =============================================
// App 生命周期
// =============================================
function openApp(appId) {
  currentApp = appId;
  currentScreen = "chatlist";
  activeChat = null;

  const data   = getAppData(appId);
  const config = getAppConfig(appId);

  appView.className = `app-view active ${config.theme}`;
  navTitle.textContent = config.name;
  navAction.textContent = config.navAction || "";

  renderChatList(data.chatList);
  applyDynamicTimes(data.feedItems);
  refreshFeed();
  startMessageArrival();
  renderTabs(data.tabs);

  showScreen("chatlist");
  homeScreen.classList.add("hidden");
  convInput.value = "";
}

function closeApp() {
  appView.classList.remove("active");
  homeScreen.classList.remove("hidden");
  currentApp = null;
  stopMessageArrival();
  updateAllBadges();
}

// =============================================
// 屏幕切换
// =============================================
function showScreen(id) {
  currentScreen = id;
  Object.keys(screens).forEach((key) => {
    screens[key].classList.toggle("hidden", key !== id);
  });
}

// =============================================
// 聊天列表渲染
// =============================================
function renderChatList(list) {
  chatlistItems.innerHTML = list.map((chat) => `
    <div class="chatlist-item" data-chat-id="${chat.id}">
      ${avatarHtml(chat.color, chat.letter, chat.role)}
      <div class="chatlist-info">
        <div class="chatlist-name">${chat.name}</div>
        <div class="chatlist-preview">${chat.preview}</div>
      </div>
      <div class="chatlist-meta">
        <div class="chatlist-time">${chat.time}</div>
        ${chat.badge > 0 ? `<span class="chatlist-badge">${chat.badge}</span>` : ""}
      </div>
    </div>
  `).join("");

  chatlistItems.querySelectorAll(".chatlist-item").forEach((el) => {
    el.addEventListener("click", () => {
      openConversation(el.dataset.chatId);
    });
  });
}

// =============================================
// 动态/朋友圈渲染
// =============================================
function renderFeed(items) {
  feedItems.innerHTML = items.map((item) => `
    <div class="feed-item">
      <div class="feed-header">
        ${feedAvatarHtml(item.color, item.letter, item.role)}
        <div>
          <div class="feed-user">${item.user}</div>
          <div class="feed-time">${item.time}</div>
        </div>
      </div>
      ${item.img ? `<div class="feed-image">${item.img}</div>` : ""}
      <div class="feed-body">
        <span class="feed-text-orig">${item.body}</span>
        ${item.tr && item.tr !== item.body ? `
          <button class="msg-translate-btn feed-tr-btn" onclick="toggleFeedTr(this)">${getAppConfig(currentApp).trLabel}</button>
          <div class="msg-translation feed-tr-text">${item.tr}</div>
        ` : ""}
      </div>
      <div class="feed-actions">
        ${item.likes ? `<span>♡ ${item.likes}</span>` : ""}
        ${item.rt ? `<span>↺ ${item.rt}</span>` : ""}
        <span>💬</span>
      </div>
    </div>
  `).join("");
}

function toggleFeedTr(btn) {
  const textEl = btn.nextElementSibling;
  const isShowing = textEl.classList.contains("show");
  if (isShowing) {
    textEl.classList.remove("show");
    btn.textContent = getAppConfig(currentApp).trLabel;
  } else {
    textEl.classList.add("show");
    btn.textContent = "收起";
  }
}

// =============================================
// Tab 渲染
// =============================================
function renderTabs(tabs) {
  appTabs.innerHTML = tabs.map((tab) => `
    <div class="tab-item ${tab.id === "chatlist" ? "active" : ""}" data-screen="${tab.id}">
      <span class="tab-icon">${tab.icon}</span>
      <span>${tab.label}</span>
    </div>
  `).join("");

  appTabs.querySelectorAll(".tab-item").forEach((el) => {
    el.addEventListener("click", () => {
      const screenId = el.dataset.screen;
      appTabs.querySelectorAll(".tab-item").forEach((t) => t.classList.remove("active"));
      el.classList.add("active");
      showScreen(screenId);
      if (activeChat && screenId === "chatlist") {
        activeChat = null;
        navTitle.textContent = getAppConfig(currentApp).name;
      }
    });
  });
}

// =============================================
// 对话页
// =============================================
function openConversation(chatId) {
  const data = getAppData(currentApp);
  const chat = data.chatList.find((c) => c.id === chatId);
  if (!chat) return;

  activeChat = chat;
  navTitle.textContent = chat.name;
  showScreen("conv");

  convMessages.innerHTML = "";
  convInput.focus();

  // Bubble：消息逐条到达，模拟粉丝正在发消息
  if (currentApp === "bubble" && chat.role === "fan") {
    var msgs = chat.messages.slice();
    var i = 0;
    function showNext() {
      if (i >= msgs.length) return;
      var msg = msgs[i];
      // 粉丝消息从"对方"发出，偶像消息从"自己"发出
      if (msg.from === "fan" || msg.from === "other") {
        // 显示"正在输入..."
        var typing = document.createElement("div");
        typing.className = "conv-msg from";
        typing.textContent = "...";
        typing.style.opacity = ".4";
        typing.id = "bubbleTyping";
        convMessages.appendChild(typing);
        scrollConvBottom();

        setTimeout(function() {
          var t = document.getElementById("bubbleTyping");
          if (t) t.remove();
          renderConvMessage(msg);
          scrollConvBottom();
          i++;
          setTimeout(showNext, 400 + Math.random() * 1200);
        }, 600 + Math.random() * 1500);
      } else {
        // 偶像自己的消息直接显示（之前发过的）
        renderConvMessage(msg);
        scrollConvBottom();
        i++;
        setTimeout(showNext, 200 + Math.random() * 600);
      }
    }
    showNext();
  } else {
    // 其他 App：一次性加载所有消息
    chat.messages.forEach(function(msg) {
      renderConvMessage(msg);
    });
    scrollConvBottom();
  }
}

function renderConvMessage(msg) {
  // from: "self" | "other" | "fan" | "idol"
  let cls = "conv-msg ";
  if (msg.from === "self" || msg.from === "idol") {
    cls += "to";
  } else {
    cls += "from";
  }

  const div = document.createElement("div");
  div.className = cls;

  // 消息正文
  const textSpan = document.createElement("span");
  textSpan.className = "msg-text-orig";
  textSpan.textContent = msg.text;
  div.appendChild(textSpan);

  // 翻译按钮
  if (msg.tr) {
    const btn = document.createElement("button");
    btn.className = "msg-translate-btn";
    btn.textContent = getAppConfig(currentApp).trLabel;
    btn.addEventListener("click", function () {
      const trDiv = this.nextElementSibling;
      const isShowing = trDiv.classList.contains("show");
      if (isShowing) {
        trDiv.classList.remove("show");
        this.textContent = getAppConfig(currentApp).trLabel;
      } else {
        trDiv.classList.add("show");
        this.textContent = "收起";
      }
    });
    div.appendChild(btn);

    const trDiv = document.createElement("div");
    trDiv.className = "msg-translation";
    trDiv.textContent = msg.tr;
    div.appendChild(trDiv);
  }

  convMessages.appendChild(div);
}

function scrollConvBottom() {
  convMessages.scrollTop = convMessages.scrollHeight;
}

function sendMessage() {
  const text = convInput.value.trim();
  if (!text || !activeChat) return;

  // 用户消息（中文）
  const userMsg = { from: currentApp === "bubble" ? "self" : "self", text: text, tr: text };
  renderConvMessage(userMsg);
  convInput.value = "";
  scrollConvBottom();

  // "输入中..."
  const typingEl = document.createElement("div");
  typingEl.className = "conv-msg from";
  typingEl.textContent = "...";
  typingEl.style.opacity = ".4";
  typingEl.style.fontStyle = "italic";
  typingEl.id = "typing";
  convMessages.appendChild(typingEl);
  scrollConvBottom();

  // 智能回复
  setTimeout(function() {
    const t = document.getElementById("typing");
    if (t) t.remove();

    var fromField = currentApp === "bubble" ? "fan" : "other";
    var reply = smartReply(text, currentApp);
    renderConvMessage({ from: fromField, text: reply.text, tr: reply.tr });
    scrollConvBottom();
  }, 600 + Math.random() * 1000);
}

    weather:   ["天气","날씨","weather","下雨","비","sunny","冷","추워","热","더워"],
    happy:     ["开心","좋아","happy","기분","신나","excited","太棒","최고","좋다"],

  for (var topic in kw) {

function getConvKey() {
  return currentApp + "_" + (activeChat ? activeChat.id : "general");
}

var lastReplyIdx = {};
function pickReply(pool, convKey) {
  if (!lastReplyIdx[convKey]) lastReplyIdx[convKey] = -1;
  var idx;
  do { idx = Math.floor(Math.random() * pool.length); }
  while (idx === lastReplyIdx[convKey] && pool.length > 1);
  lastReplyIdx[convKey] = idx;
  return pool[idx];
}

// 判断是否为群聊
function isGroupChat() {
  if (!activeChat) return false;
  var name = activeChat.name || "";
  return name.indexOf("群") >= 0 || name.indexOf("단톡") >= 0 || name.indexOf("팀") >= 0;
}

// 群聊成员
var groupMembers = {
  "댄스팀 단톡": ["댄서 오빠","지수","민지","안무 선생님"],
  "宣传组工作群": ["宣传组小陈","设计师小王","文案小刘","摄影师老张"],
};

function getGroupReplier() {
  if (!activeChat) return "";
  var members = groupMembers[activeChat.name] || ["成员A","成员B"];
  return members[Math.floor(Math.random() * members.length)];
}

// 对话上下文追踪（轮次 + 话题）
function getTopicRound(convKey, topic) {
  if (!convMemory[convKey]) convMemory[convKey] = {};
  if (!convMemory[convKey][topic]) convMemory[convKey][topic] = 0;
  convMemory[convKey][topic]++;
  return convMemory[convKey][topic];
}

// 差异化回复延迟
function getReplyDelay() {
  if (!activeChat) return 800;
  var name = activeChat.name || "";
  if (isGroupChat()) return 500 + Math.random() * 800;
  if (name.indexOf("엄마") >= 0 || name.indexOf("妈妈") >= 0) return 1000 + Math.random() * 2000;
  if (name.indexOf("매니저") >= 0 || name.indexOf("经纪") >= 0) return 600 + Math.random() * 1500;
  if (currentApp === "bubble") return 1500 + Math.random() * 3000;
  return 400 + Math.random() * 1000;
}

// 群聊回复前缀
function groupPrefix() {
  if (!isGroupChat()) return "";
  return "[" + getGroupReplier() + "] ";
}

function smartReply(userText, appId) {
  var pool = smartPools[appId] || smartPools.kakaotalk;
  var topics = detectTopic(userText, appId);
  var convKey = getConvKey();
  var topic = topics[0];
  var round = getTopicRound(convKey, topic);

  // 30%随机换个话题
  if (Math.random() < 0.3) {
    var keys = Object.keys(pool).filter(function(k) { return k !== "general"; });
    topic = keys[Math.floor(Math.random() * keys.length)];
  }
  // 第二轮+有40%概率用追问回复
  if (round > 1 && Math.random() < 0.4 && pool.followup) {
    topic = "followup";
  }
  if (!pool[topic]) topic = "general";

  var reply = pickReply(pool[topic], convKey);

  // 群聊加前缀
  if (isGroupChat()) {
    reply = { text: groupPrefix() + reply.text, tr: groupPrefix() + reply.tr };
  }

  return reply;
}

// =============================================
// 桌面角标管理
// =============================================
var badgeEls = {
  kakaotalk: document.getElementById("badgeKakao"),
  instagram: document.getElementById("badgeInsta"),
  wechat:    document.getElementById("badgeWechat"),
  twitter:   document.getElementById("badgeTwitter"),
  bubble:    document.getElementById("badgeBubble"),
};

function getTotalBadge(appId) {
  var data = getAppData(appId);
  if (!data || !data.chatList) return 0;
  var total = 0;
  data.chatList.forEach(function(c) { total += c.badge || 0; });
  return total;
}

function updateAllBadges() {
  Object.keys(badgeEls).forEach(function(appId) {
    var el = badgeEls[appId];
    if (!el) return;
    var count = getTotalBadge(appId);
    if (count > 0) {
      el.textContent = count > 99 ? "99+" : count;
      el.classList.add("show");
    } else {
      el.classList.remove("show");
    }
  });
}

function pulseBadge(appId) {
  var el = badgeEls[appId];
  if (!el) return;
  el.classList.remove("pulse");
  void el.offsetWidth;
  el.classList.add("pulse");
}

// =============================================
// 消息实时到达模拟
// =============================================
var arrivalTimer = null;

function startMessageArrival() {
  stopMessageArrival();
  arrivalTimer = setInterval(function() {
    if (currentApp && currentScreen === "chatlist") {
      simulateNewMessage(currentApp);
    }
  }, 15000 + Math.random() * 30000); // 每15-45秒
}

function stopMessageArrival() {
  if (arrivalTimer) { clearInterval(arrivalTimer); arrivalTimer = null; }
}

function simulateNewMessage(appId) {
  var data = getAppData(appId);
  if (!data) return;
  var list = data.chatList;
  var idx = Math.floor(Math.random() * list.length);
  var chat = list[idx];

  // 随机新消息内容
  var newMsgs = {
    kakaotalk: ["보고 싶어 ㅠㅠ","야~ 뭐해?","오늘 진짜 대박이야","나 방금 신곡 들었어!","주말 약속 잊지 마~"],
    instagram: ["Just saw your new post!! 🔥","OMG you're glowing ✨","When's the next live?","Love from Brazil! 🇧🇷","You inspire me so much"],
    wechat: ["在吗？","今天辛苦了","明天见~","好的收到","刚才那个方案看了吗"],
    twitter: ["you're trending again! 📈","new fancam just dropped","DM me back when you can","that stage was iconic","thoughts on the new teaser?"],
    bubble: ["오늘 하루도 수고했어요 💕","언니 보고 싶어요...","맛있는 저녁 드세요!","내일도 화이팅","새 앨범 너무 기대돼요"],
  };

  var pool = newMsgs[appId] || newMsgs.kakaotalk;
  var newText = pool[Math.floor(Math.random() * pool.length)];

  // 更新聊天列表数据
  chat.preview = newText;
  var now = new Date();
  var h = now.getHours(), m = now.getMinutes();
  chat.time = (h < 10 ? "" : "") + h + ":" + (m < 10 ? "0" : "") + m;
  chat.badge = (chat.badge || 0) + 1;

  // 刷新列表显示
  if (currentApp === appId && currentScreen === "chatlist") {
    renderChatList(data.chatList);
  }

  // 更新角标
  updateAllBadges();
  if (currentApp !== appId || currentScreen !== "chatlist") {
    pulseBadge(appId);
  }
}

// =============================================
// 动态时间实时化
// =============================================
function dynamicTime(offsetMinutes) {
  var now = new Date();
  var t = new Date(now.getTime() - offsetMinutes * 60 * 1000);
  var diffMin = Math.floor((now - t) / 1000 / 60);
  if (diffMin < 1) return "刚刚";
  if (diffMin < 60) return diffMin + "分钟前";
  if (diffMin < 120) return "1小时前";
  if (diffMin < 1440) return Math.floor(diffMin / 60) + "小时前";
  if (diffMin < 2880) return "昨天";
  return Math.floor(diffMin / 1440) + "天前";
}

function dynamicTimeKR(offsetMinutes) {
  var now = new Date();
  var t = new Date(now.getTime() - offsetMinutes * 60 * 1000);
  var diffMin = Math.floor((now - t) / 1000 / 60);
  if (diffMin < 1) return "방금";
  if (diffMin < 60) return diffMin + "분 전";
  if (diffMin < 120) return "1시간 전";
  if (diffMin < 1440) return Math.floor(diffMin / 60) + "시간 전";
  if (diffMin < 2880) return "어제";
  return Math.floor(diffMin / 1440) + "일 전";
}

// 为 Mock 动态生成实时时间偏移（首次加载时随机分配，后续保持不变）
var feedTimeOffsets = {};

function getFeedTimeOffset(feedKey, lang) {
  if (!feedTimeOffsets[feedKey]) {
    // 随机分配：几分钟到几天前
    var pool = [
      Math.random() * 30,          // 0-30分钟前
      30 + Math.random() * 90,     // 30-120分钟前
      120 + Math.random() * 240,   // 2-6小时前
      360 + Math.random() * 360,   // 6-12小时前
      720 + Math.random() * 720,   // 12-24小时前
      1440 + Math.random() * 1440, // 1-2天前
      2880 + Math.random() * 2160, // 2-5天前
    ];
    feedTimeOffsets[feedKey] = pool[Math.floor(Math.random() * pool.length)];
  }
  var offset = feedTimeOffsets[feedKey];
  if (lang === "ko") return dynamicTimeKR(offset);
  return dynamicTime(offset);
}

// 覆盖 feed 数据中的时间为动态时间（在渲染前调用）
function applyDynamicTimes(items) {
  items.forEach(function(item, i) {
    var lang = (currentApp === "kakaotalk" || currentApp === "bubble") ? "ko" : "zh";
    item.time = getFeedTimeOffset(currentApp + "_feed_" + i, lang);
  });
}

    ".app-icon.bubble { animation: pulse-glow 2s ease-in-out infinite; }"
  ].join("\n");
  document.head.appendChild(style);

  // 安装引导
  setupInstallUI();

  // 桌面角标
  updateAllBadges();

  // 实时时间电量
  syncStatusBar();

  // 检查是否有已保存的偶像资料
  var profile = loadProfile();
  if (profile && profile.stageName) {
    fillForm(profile);
    enterPhone();
  } else {
    showSetupScreen(false);
  }
})();
