<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0f0f1a" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <title>idol — 偶像生活模拟器</title>
  <style>
/* ===== 基础 ===== */
:root {
  --phone-w: 390px;
  --phone-h: 844px;
  --phone-radius: 44px;
  color-scheme: dark;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: #1a1a2e;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  -webkit-tap-highlight-color: transparent;
  user-select: none; -webkit-user-select: none;
}

/* ===== 偶像设定页 ===== */
.setup-screen {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: radial-gradient(ellipse at 50% 0%, #1e1b4b 0%, #0f0f1a 60%, #000 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  transition: opacity .5s ease, transform .5s ease;
}
.setup-screen.hidden {
  opacity: 0;
  pointer-events: none;
  transform: scale(1.05);
}

.setup-card {
  width: 100%;
  max-width: 360px;
  max-height: 90vh;
  overflow-y: auto;
  background: rgba(255,255,255,.03);
  border: 1px solid rgba(255,255,255,.06);
  border-radius: 28px;
  padding: 32px 24px 28px;
  box-shadow: 0 25px 60px rgba(0,0,0,.5);
  -webkit-overflow-scrolling: touch;
}

.setup-header {
  text-align: center;
  margin-bottom: 24px;
}

/* App 图标 */
.app-logo-wrap {
  display: flex;
  justify-content: center;
  margin-bottom: 20px;
}
.app-logo {
  width: 100px;
  height: 100px;
  filter: drop-shadow(0 8px 24px rgba(100,80,180,.35));
}

.setup-header h1 {
  font-size: 22px;
  font-weight: 700;
  color: #fff;
  margin: 0 0 6px;
}
.setup-header p {
  font-size: 13px;
  color: rgba(255,255,255,.4);
  line-height: 1.6;
  margin: 0;
}

.setup-form {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.form-row {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.form-row-split {
  flex-direction: row;
  gap: 12px;
}
.form-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.form-label {
  font-size: 12px;
  font-weight: 600;
  color: rgba(255,255,255,.55);
  text-transform: uppercase;
  letter-spacing: .5px;
}
.form-label .required { color: #FF6BA6; }

.form-input {
  width: 100%;
  padding: 12px 14px;
  border-radius: 14px;
  border: 1px solid rgba(255,255,255,.08);
  background: rgba(255,255,255,.04);
  color: #fff;
  font-size: 15px;
  outline: none;
  transition: border-color .2s, background .2s;
  font-family: inherit;
}
.form-input:focus {
  border-color: rgba(255,107,166,.4);
  background: rgba(255,255,255,.06);
}
.form-input::placeholder { color: rgba(255,255,255,.18); }

/* 选项芯片 */
.option-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.opt-chip {
  padding: 9px 16px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  border: 1px solid rgba(255,255,255,.1);
  background: rgba(255,255,255,.03);
  color: rgba(255,255,255,.5);
  transition: all .18s;
}
.opt-chip:hover { background: rgba(255,255,255,.08); color: rgba(255,255,255,.7); }
.opt-chip.active {
  background: rgba(255,255,255,.12);
  border-color: rgba(255,255,255,.25);
  color: #fff;
  font-weight: 600;
  box-shadow: 0 0 12px rgba(255,107,166,.15);
}

/* 进入按钮 */
.setup-btn {
  width: 100%;
  margin-top: 24px;
  padding: 14px;
  border: none;
  border-radius: 16px;
  background: linear-gradient(135deg, #FF6BA6, #C44569);
  color: #fff;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: transform .15s, box-shadow .15s;
  letter-spacing: .5px;
  box-shadow: 0 8px 30px rgba(196,69,105,.3);
}
.setup-btn:hover { transform: translateY(-1px); box-shadow: 0 12px 36px rgba(196,69,105,.4); }
.setup-btn:active { transform: translateY(0); }
.setup-btn:disabled {
  opacity: .4;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}

.setup-hint {
  text-align: center;
  font-size: 11px;
  color: rgba(255,255,255,.25);
  margin-top: 12px;
  min-height: 16px;
}

/* ===== 安装引导条 ===== */
.install-banner {
  width: 100%;
  max-width: 360px;
  margin-top: 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  background: rgba(255,255,255,.05);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 20px;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  transition: opacity .3s, transform .3s;
}
.install-banner.dismissed {
  opacity: 0;
  pointer-events: none;
  transform: translateY(10px);
}
.install-banner-icon {
  flex-shrink: 0;
}
.install-banner-icon svg {
  width: 48px;
  height: 48px;
}
.install-banner-text {
  flex: 1;
  min-width: 0;
}
.install-banner-title {
  font-size: 14px;
  font-weight: 600;
  color: #fff;
}
.install-banner-desc {
  font-size: 11px;
  color: rgba(255,255,255,.4);
  margin-top: 2px;
}
.install-banner-btn {
  padding: 9px 18px;
  border-radius: 18px;
  border: none;
  background: linear-gradient(135deg, #FF6BA6, #C44569);
  color: #fff;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  flex-shrink: 0;
  transition: transform .12s, box-shadow .12s;
  min-width: 0;
  box-shadow: 0 4px 14px rgba(196,69,105,.3);
}
.install-banner-btn:hover { transform: translateY(-1px); }
.install-banner-btn:active { transform: translateY(0); }
.install-banner-btn.ios-guide {
  background: rgba(255,255,255,.1);
  color: rgba(255,255,255,.6);
  box-shadow: none;
  font-weight: 500;
}

/* ---- 全局安装引导条 ---- */
.global-install-bar {
  position: fixed;
  bottom: 16px;
  left: 16px;
  right: 16px;
  z-index: 250;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  background: rgba(20,20,45,.92);
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 16px;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  box-shadow: 0 8px 32px rgba(0,0,0,.4);
  transition: opacity .3s, transform .3s;
}
.global-install-bar.dismissed {
  opacity: 0;
  pointer-events: none;
  transform: translateY(20px);
}
.gib-icon { font-size: 28px; flex-shrink: 0; }
.gib-text { flex: 1; font-size: 13px; font-weight: 500; color: rgba(255,255,255,.85); min-width: 0; }
.gib-btn {
  padding: 8px 16px;
  border-radius: 20px;
  border: none;
  background: linear-gradient(135deg, #FF6BA6, #C44569);
  color: #fff;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  flex-shrink: 0;
  box-shadow: 0 4px 14px rgba(196,69,105,.3);
  min-width: 0;
}
.gib-btn:active { transform: scale(.95); }

/* ---- 首页顶部行 ---- */
.home-top-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 320px;
  margin-bottom: 8px;
  padding: 0 4px;
}
.home-greeting {
  color: rgba(255,255,255,.7);
  font-size: 14px;
  font-weight: 500;
}
.home-settings-btn {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: none;
  background: rgba(255,255,255,.08);
  color: rgba(255,255,255,.5);
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background .15s, color .15s;
  min-width: 0;
  padding: 0;
}
.home-settings-btn:hover { background: rgba(255,255,255,.15); color: #fff; }

/* 手机容器初始隐藏 */
#phoneContainer { display: none; }
#phoneContainer.ready { display: flex; }

/* ===== 手机外壳 ===== */
.phone-container {
  width: var(--phone-w);
  height: var(--phone-h);
  background: #000;
  border-radius: var(--phone-radius);
  position: relative;
  overflow: hidden;
  box-shadow:
    0 0 0 3px #1a1a1a, 0 0 0 6px #222, 0 0 0 8px #111, 0 20px 60px rgba(0,0,0,.5);
  display: flex;
  flex-direction: column;
}

/* ===== 状态栏 ===== */
.status-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 28px 6px 28px;
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: .5px;
  z-index: 30;
  position: relative;
  pointer-events: none;
}

/* ===== 主屏幕 ===== */
.home-screen {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: linear-gradient(180deg, #1c1c1e 0%, #000 100%);
  padding-bottom: 30px;
  transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s ease;
}
.home-screen.hidden { transform: scale(.92); opacity: 0; pointer-events: none; }

.folder-label { color: #fff; font-size: 20px; font-weight: 600; margin-bottom: 16px; letter-spacing: .5px; }

.folder-area {
  background: rgba(255,255,255,.08);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-radius: 28px;
  padding: 24px 20px 20px 20px;
  width: 320px;
}

.app-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px 16px;
}

.app-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  transition: transform .15s ease;
}
.app-item:active { transform: scale(.88); }

.app-icon {
  position: relative;
  width: 68px; height: 68px;
  border-radius: 17px;
  overflow: hidden;
  box-shadow: 0 4px 12px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.15);
}
.icon-svg { display: block; width: 100%; height: 100%; }

.app-name {
  color: #fff; font-size: 11px; font-weight: 500; letter-spacing: .2px;
  text-align: center; max-width: 72px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

.app-icon.kakaotalk { background: #FEE500; }
.app-icon.instagram  { background: linear-gradient(135deg, #FCAF45, #E1306C, #833AB4, #405DE6); }
.app-icon.wechat     { background: #2BBF6A; }
.app-icon.twitter    { background: #000; }
.app-icon.bubble     { background: linear-gradient(135deg, #FF85B3, #FF6BA6, #C44569); }

.home-indicator {
  width: 134px; height: 5px; background: rgba(255,255,255,.35);
  border-radius: 3px; position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
}

/* =============================================
   应用视图（打开 App 后）
   ============================================= */
.app-view {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  display: flex; flex-direction: column;
  background: #000;
  transform: translateX(100%);
  transition: transform .35s cubic-bezier(.4,0,.2,1);
  border-radius: var(--phone-radius);
  overflow: hidden;
  z-index: 20;
  padding-top: 50px;
}
.app-view.active { transform: translateX(0); }

/* ---- 导航栏 ---- */
.app-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 8px 0 12px;
  height: 46px;
  flex-shrink: 0;
  border-bottom: 1px solid rgba(255,255,255,.08);
}

.nav-back {
  background: none; border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  width: 36px; height: 36px; border-radius: 50%;
  color: inherit; font-size: 28px; line-height: 1; font-weight: 300;
  transition: background .15s;
  min-width: 0; padding: 0;
}
.nav-back:hover { background: rgba(255,255,255,.1); }

.nav-title {
  font-size: 17px; font-weight: 600;
  position: absolute; left: 50%; transform: translateX(-50%);
  pointer-events: none;
  max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

.nav-action {
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; opacity: .7;
}

/* ---- 内容区 ---- */
.app-content {
  flex: 1;
  overflow: hidden;
  position: relative;
}

.screen {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  transition: opacity .2s ease, transform .2s ease;
}
.screen.hidden { opacity: 0; pointer-events: none; transform: translateY(4px); }

/* ---- 聊天列表 ---- */
.chatlist-scroll, .feed-scroll {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

.chatlist-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  cursor: pointer;
  transition: background .12s;
  border-bottom: 1px solid rgba(255,255,255,.04);
}
.chatlist-item:hover { background: rgba(255,255,255,.03); }
.chatlist-item:active { background: rgba(255,255,255,.06); }

.chatlist-avatar {
  width: 48px; height: 48px;
  border-radius: 50%;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 700; color: #fff;
}
.chatlist-info { flex: 1; min-width: 0; }
.chatlist-name { font-size: 15px; font-weight: 600; margin-bottom: 3px; }
.chatlist-preview {
  font-size: 13px; opacity: .55;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.chatlist-meta { text-align: right; flex-shrink: 0; }
.chatlist-time { font-size: 11px; opacity: .4; margin-bottom: 4px; }
.chatlist-badge {
  display: inline-block;
  min-width: 18px; height: 18px; line-height: 18px;
  background: #ff3b30; color: #fff;
  font-size: 11px; font-weight: 600; text-align: center;
  border-radius: 9px; padding: 0 5px;
}

/* ---- 动态/朋友圈 ---- */
.feed-item {
  border-bottom: 1px solid rgba(255,255,255,.05);
  animation: fadeUp .3s ease;
}
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.feed-header {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 16px 8px;
}
.feed-avatar {
  width: 40px; height: 40px; border-radius: 50%;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 700; color: #fff;
}
.feed-user { font-size: 14px; font-weight: 600; }
.feed-time { font-size: 11px; opacity: .4; margin-top: 2px; }

.feed-body {
  padding: 0 16px 12px;
  font-size: 14px; line-height: 1.6;
}

.feed-image {
  margin: 0 16px 12px;
  height: 180px;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 32px;
  overflow: hidden;
}

.feed-actions {
  display: flex; gap: 20px;
  padding: 4px 16px 14px;
  font-size: 12px; opacity: .5;
}

/* ---- 对话页 ---- */
.conv-messages {
  flex: 1;
  overflow-y: auto;
  padding: 12px 14px;
  display: flex; flex-direction: column;
  gap: 8px;
  -webkit-overflow-scrolling: touch;
}

.conv-date-divider {
  text-align: center;
  font-size: 11px; opacity: .35;
  padding: 8px 0;
}

.conv-msg {
  max-width: 78%;
  padding: 9px 13px;
  border-radius: 17px;
  font-size: 14.5px;
  line-height: 1.5;
  word-break: break-word;
  animation: msgIn .25s ease-out;
  position: relative;
}
@keyframes msgIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

.conv-msg.from { align-self: flex-start; border-bottom-left-radius: 5px; }
.conv-msg.to   { align-self: flex-end;   border-bottom-right-radius: 5px; }

/* 翻译按钮 */
.msg-translate-btn {
  display: block;
  margin-top: 5px;
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 10px;
  border: 0.5px solid rgba(255,255,255,.15);
  background: rgba(255,255,255,.04);
  color: inherit;
  opacity: .45;
  cursor: pointer;
  width: fit-content;
  transition: opacity .15s, background .15s;
  font-family: inherit;
}
.msg-translate-btn:hover { opacity: .8; background: rgba(255,255,255,.1); }
.msg-translate-btn.translated { opacity: .7; }

.msg-translation {
  display: none;
  margin-top: 5px;
  font-size: 12px;
  opacity: .65;
  padding: 4px 8px;
  border-left: 2px solid rgba(255,255,255,.2);
  line-height: 1.5;
}
.msg-translation.show { display: block; }

.conv-input-bar {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px 10px;
  border-top: 1px solid rgba(255,255,255,.06);
}
.conv-input {
  flex: 1;
  border: none; border-radius: 20px;
  padding: 9px 14px;
  font-size: 14px;
  outline: none;
  background: rgba(255,255,255,.08);
  color: #fff;
}
.conv-input::placeholder { opacity: .35; }
.conv-send {
  width: 36px; height: 36px; border-radius: 50%;
  border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 700;
  transition: transform .12s;
  min-width: 0; padding: 0;
}
.conv-send:active { transform: scale(.9); }

/* ---- 底部 Tab 栏 ---- */
.app-tabs {
  display: flex;
  height: 50px;
  flex-shrink: 0;
  border-top: 1px solid rgba(255,255,255,.06);
}
.tab-item {
  flex: 1;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 3px;
  cursor: pointer;
  font-size: 10px; font-weight: 500;
  opacity: .45;
  transition: opacity .15s;
}
.tab-item:hover { opacity: .7; }
.tab-item.active { opacity: 1; font-weight: 600; }
.tab-icon { font-size: 20px; line-height: 1; }

/* =============================================
   主题: KakaoTalk
   ============================================= */
.app-view.theme-kakaotalk .app-nav { background: #FEE500; border-bottom-color: rgba(0,0,0,.06); }
.app-view.theme-kakaotalk .app-nav .nav-back { color: #191919; }
.app-view.theme-kakaotalk .nav-title { color: #191919; }
.app-view.theme-kakaotalk .screen-chatlist { background: #B2C7DA; }
.app-view.theme-kakaotalk .chatlist-name { color: #191919; }
.app-view.theme-kakaotalk .chatlist-preview { color: #3d4a55; opacity: 1; }
.app-view.theme-kakaotalk .chatlist-time { color: #5a6b78; opacity: 1; }
.app-view.theme-kakaotalk .chatlist-item { border-bottom-color: rgba(0,0,0,.06); }
.app-view.theme-kakaotalk .chatlist-item:hover { background: rgba(0,0,0,.03); }
.app-view.theme-kakaotalk .chatlist-item:active { background: rgba(0,0,0,.06); }
.app-view.theme-kakaotalk .screen-feed { background: #f5f5f7; }
.app-view.theme-kakaotalk .feed-item { border-bottom-color: rgba(0,0,0,.06); }
.app-view.theme-kakaotalk .feed-user { color: #191919; }
.app-view.theme-kakaotalk .feed-body { color: #333; }
.app-view.theme-kakaotalk .feed-time { color: #888; opacity: 1; }
.app-view.theme-kakaotalk .feed-image { background: linear-gradient(135deg, #FEE500, #ffb347); }
.app-view.theme-kakaotalk .feed-actions { color: #666; opacity: 1; }
.app-view.theme-kakaotalk .conv-messages { background: #B2C7DA; }
.app-view.theme-kakaotalk .conv-msg.from { background: #fff; color: #191919; }
.app-view.theme-kakaotalk .conv-msg.to { background: #FEE500; color: #191919; }
.app-view.theme-kakaotalk .conv-input { background: #fff; color: #191919; }
.app-view.theme-kakaotalk .conv-input::placeholder { color: rgba(0,0,0,.3); }
.app-view.theme-kakaotalk .conv-send { background: #FEE500; color: #191919; }
.app-view.theme-kakaotalk .msg-translate-btn { border-color: rgba(0,0,0,.12); background: rgba(0,0,0,.03); }
.app-view.theme-kakaotalk .msg-translate-btn:hover { background: rgba(0,0,0,.08); }
.app-view.theme-kakaotalk .app-tabs { background: #f9f9fb; border-top-color: rgba(0,0,0,.06); }
.app-view.theme-kakaotalk .tab-item { color: #5a6b78; }

<body>

  <!-- ====== 偶像设定页面 ====== -->

              <stop offset="45%" stop-color="#d4d4d4"/>
              <stop offset="100%" stop-color="#999999"/>
            </linearGradient>
            <filter id="logoGlow">
              <feGaussianBlur stdDeviation="1.5" result="blur"/>
              <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          <!-- 圆角方形底 -->
          <rect x="0" y="0" width="120" height="120" rx="28" fill="url(#logoBg)" stroke="rgba(255,255,255,.08)" stroke-width="1.5"/>
          <!-- 内光晕 -->
          <rect x="6" y="6" width="108" height="108" rx="23" fill="none" stroke="rgba(255,255,255,.04)" stroke-width="1"/>
          <!-- idol 字样 -->
          <text x="60" y="73" text-anchor="middle" font-size="36" font-weight="700" font-family="'Segoe UI', -apple-system, sans-serif" fill="url(#logoText)" filter="url(#logoGlow)" letter-spacing="3">idol</text>
          <!-- 星光粒子 -->
          <circle cx="22" cy="22" r="2" fill="#fff" opacity="0.8"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="2s" repeatCount="indefinite"/></circle>
          <circle cx="96" cy="18" r="1.5" fill="#fff" opacity="0.6"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="2.5s" repeatCount="indefinite"/></circle>

          <g transform="translate(24,24)" opacity="0.6">
            <animate attributeName="opacity" values="0.6;0;0.6" dur="1.5s" repeatCount="indefinite"/>

            <line x1="-5" y1="0" x2="5" y2="0" stroke="#fff" stroke-width="0.8" stroke-linecap="round"/>

            <line x1="-3.5" y1="0" x2="3.5" y2="0" stroke="#fff" stroke-width="0.7" stroke-linecap="round"/>
          </g>
        </svg>
      </div>

      <div class="setup-header">
        <h1>偶像身份设定</h1>
        <p>在开始你的偶像生活之前<br>先定义你的角色吧</p>
      </div>

      <div class="setup-form">
        <div class="form-row">
          <label class="form-label">艺名 <span class="required">*</span></label>
          <input type="text" id="setStageName" class="form-input" placeholder="例：花音" maxlength="12" />
        </div>

        <div class="form-row">
          <label class="form-label">本名</label>
          <input type="text" id="setRealName" class="form-input" placeholder="例：金智秀（选填）" maxlength="12" />
        </div>

        <div class="form-row form-row-split">
          <div class="form-col">
            <label class="form-label">年龄 <span class="required">*</span></label>
            <input type="number" id="setAge" class="form-input" placeholder="20" min="15" max="35" />
          </div>
          <div class="form-col">
            <label class="form-label">身高 (cm)</label>
            <input type="number" id="setHeight" class="form-input" placeholder="165" min="145" max="195" />
          </div>
        </div>

        <div class="form-row">
          <label class="form-label">出道年份 <span class="required">*</span></label>
          <input type="number" id="setDebutYear" class="form-input" placeholder="例：2022" min="2010" max="2026" />
        </div>

        <div class="form-row">
          <label class="form-label">身份类型</label>
          <div class="option-row" id="idolType">
            <span class="opt-chip" data-value="solo">Solo 歌手</span>
            <span class="opt-chip active" data-value="group">组合成员</span>

        <div class="form-row">

            <span class="opt-chip" data-value="sweet">甜美</span>
            <span class="opt-chip active" data-value="energetic">元气</span>
            <span class="opt-chip" data-value="mature">成熟</span>
            <span class="opt-chip" data-value="calm">冷静</span>
          </div>
        </div>

        <div class="form-row">
          <label class="form-label">所属组合/公司（选填）</label>
          <input type="text" id="setGroup" class="form-input" placeholder="例：STARSHIP / HYBE" maxlength="20" />
        </div>
      </div>

      <button class="setup-btn" id="setupBtn">✦ 进入我的偶像生活</button>
      <p class="setup-hint" id="setupHint"></p>
    </div>

// =============================================
// App 配置
// =============================================
function getAppData(appId) {
  const map = { kakaotalk: data_kakaotalk, instagram: data_instagram, wechat: data_wechat, twitter: data_twitter, bubble: data_bubble };
  return map[appId];
}

function getAppConfig(appId) {
  return {
    kakaotalk: { name: "KakaoTalk", theme: "theme-kakaotalk", navAction: "+", trLabel: "译" },
    instagram: { name: "Instagram", theme: "theme-instagram", navAction: "✎", trLabel: "译" },
    wechat:    { name: "微信",      theme: "theme-wechat",    navAction: "+", trLabel: "译" },
    twitter:   { name: "X",         theme: "theme-twitter",   navAction: "✎", trLabel: "译" },
    bubble:    { name: "Bubble",    theme: "theme-bubble",    navAction: "",  trLabel: "译" },
  }[appId];
}

// =============================================
// App 生命周期
// =============================================
function openApp(appId) {
  currentApp = appId;
  currentScreen = "chatlist";
  activeChat = null;

  const data   = getAppData(appId);
  const config = getAppConfig(appId);

  appView.className = `app-view active ${config.theme}`;
  navTitle.textContent = config.name;
  navAction.textContent = config.navAction || "";

  renderChatList(data.chatList);
  renderFeed(data.feedItems);
  renderTabs(data.tabs);

  showScreen("chatlist");
  homeScreen.classList.add("hidden");
  convInput.value = "";
}

function closeApp() {
  appView.classList.remove("active");
  homeScreen.classList.remove("hidden");
  currentApp = null;
}

// =============================================
// 屏幕切换
// =============================================
function showScreen(id) {
  currentScreen = id;
  Object.keys(screens).forEach((key) => {
    screens[key].classList.toggle("hidden", key !== id);
  });
}

// =============================================
// 聊天列表渲染
// =============================================
function renderChatList(list) {
  chatlistItems.innerHTML = list.map((chat) => `
    <div class="chatlist-item" data-chat-id="${chat.id}">
      ${avatarHtml(chat.color, chat.letter)}
      <div class="chatlist-info">
        <div class="chatlist-name">${chat.name}</div>
        <div class="chatlist-preview">${chat.preview}</div>
      </div>
      <div class="chatlist-meta">
        <div class="chatlist-time">${chat.time}</div>
        ${chat.badge > 0 ? `<span class="chatlist-badge">${chat.badge}</span>` : ""}
      </div>
    </div>
  `).join("");

  chatlistItems.querySelectorAll(".chatlist-item").forEach((el) => {
    el.addEventListener("click", () => {
      openConversation(el.dataset.chatId);
    });
  });
}

// =============================================
// 动态/朋友圈渲染
// =============================================
function renderFeed(items) {
  feedItems.innerHTML = items.map((item) => `
    <div class="feed-item">
      <div class="feed-header">
        ${feedAvatarHtml(item.color, item.letter)}
        <div>
          <div class="feed-user">${item.user}</div>
          <div class="feed-time">${item.time}</div>
        </div>
      </div>
      ${item.img ? `<div class="feed-image">${item.img}</div>` : ""}
      <div class="feed-body">
        <span class="feed-text-orig">${item.body}</span>
        ${item.tr && item.tr !== item.body ? `
          <button class="msg-translate-btn feed-tr-btn" onclick="toggleFeedTr(this)">${getAppConfig(currentApp).trLabel}</button>
          <div class="msg-translation feed-tr-text">${item.tr}</div>
        ` : ""}
      </div>
      <div class="feed-actions">
        ${item.likes ? `<span>♡ ${item.likes}</span>` : ""}
        ${item.rt ? `<span>↺ ${item.rt}</span>` : ""}
        <span>💬</span>
      </div>
    </div>
  `).join("");
}

function toggleFeedTr(btn) {
  const textEl = btn.nextElementSibling;
  const isShowing = textEl.classList.contains("show");
  if (isShowing) {
    textEl.classList.remove("show");
    btn.textContent = getAppConfig(currentApp).trLabel;
  } else {
    textEl.classList.add("show");
    btn.textContent = "收起";
  }
}

// =============================================
// Tab 渲染
// =============================================
function renderTabs(tabs) {
  appTabs.innerHTML = tabs.map((tab) => `
    <div class="tab-item ${tab.id === "chatlist" ? "active" : ""}" data-screen="${tab.id}">
      <span class="tab-icon">${tab.icon}</span>
      <span>${tab.label}</span>
    </div>
  `).join("");

  appTabs.querySelectorAll(".tab-item").forEach((el) => {
    el.addEventListener("click", () => {
      const screenId = el.dataset.screen;
      appTabs.querySelectorAll(".tab-item").forEach((t) => t.classList.remove("active"));
      el.classList.add("active");
      showScreen(screenId);
      if (activeChat && screenId === "chatlist") {
        activeChat = null;
        navTitle.textContent = getAppConfig(currentApp).name;
      }
    });
  });
}

// =============================================
// 对话页
// =============================================
function openConversation(chatId) {
  const data = getAppData(currentApp);
  const chat = data.chatList.find((c) => c.id === chatId);
  if (!chat) return;

  activeChat = chat;
  navTitle.textContent = chat.name;
  showScreen("conv");

  convMessages.innerHTML = "";
  chat.messages.forEach((msg) => {
    renderConvMessage(msg);
  });
  scrollConvBottom();
  convInput.focus();
}

function renderConvMessage(msg) {
  // from: "self" | "other" | "fan" | "idol"
  let cls = "conv-msg ";
  if (msg.from === "self" || msg.from === "idol") {
    cls += "to";
  } else {
    cls += "from";
  }

  const div = document.createElement("div");
  div.className = cls;

  // 消息正文
  const textSpan = document.createElement("span");
  textSpan.className = "msg-text-orig";
  textSpan.textContent = msg.text;
  div.appendChild(textSpan);

  // 翻译按钮
  if (msg.tr) {
    const btn = document.createElement("button");
    btn.className = "msg-translate-btn";
    btn.textContent = getAppConfig(currentApp).trLabel;
    btn.addEventListener("click", function () {
      const trDiv = this.nextElementSibling;
      const isShowing = trDiv.classList.contains("show");
      if (isShowing) {
        trDiv.classList.remove("show");
        this.textContent = getAppConfig(currentApp).trLabel;
      } else {
        trDiv.classList.add("show");
        this.textContent = "收起";
      }
    });
    div.appendChild(btn);

    const trDiv = document.createElement("div");
    trDiv.className = "msg-translation";
    trDiv.textContent = msg.tr;
    div.appendChild(trDiv);
  }

  convMessages.appendChild(div);
}

function scrollConvBottom() {
  convMessages.scrollTop = convMessages.scrollHeight;
}

function sendMessage() {
  const text = convInput.value.trim();
  if (!text || !activeChat) return;

  // 用户消息（中文）
  const userMsg = { from: currentApp === "bubble" ? "self" : "self", text: text, tr: text };
  renderConvMessage(userMsg);
  convInput.value = "";
  scrollConvBottom();

  // "输入中..."
  const typingEl = document.createElement("div");
  typingEl.className = "conv-msg from";
  typingEl.textContent = "...";
  typingEl.style.opacity = ".4";
  typingEl.style.fontStyle = "italic";
  typingEl.id = "typing";
  convMessages.appendChild(typingEl);
  scrollConvBottom();

  // 模拟回复（保留原应用语言风格）
  setTimeout(() => {
    const t = document.getElementById("typing");
    if (t) t.remove();

    const reply = generateReply(text);
    const fromField = currentApp === "bubble" ? "fan" : "other";
    renderConvMessage({ from: fromField, text: reply.text, tr: reply.tr });
    scrollConvBottom();
  }, 800 + Math.random() * 1500);
}

let installHandled = false;

function detectPlatform() {
  const ua = navigator.userAgent || "";
  const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const isAndroid = /Android/.test(ua);

  if (isIOS) {
    if (/CriOS/.test(ua))  return { os: "ios", browser: "chrome" };
    if (/FxiOS/.test(ua))  return { os: "ios", browser: "firefox" };
    if (/EdgiOS/.test(ua)) return { os: "ios", browser: "edge" };
    if (/Safari/.test(ua)) return { os: "ios", browser: "safari" };
    return { os: "ios", browser: "other" };
  }
  if (isAndroid) {
    if (/SamsungBrowser/.test(ua)) return { os: "android", browser: "samsung" };
    if (/EdgA\//.test(ua) || /Edg\//.test(ua)) return { os: "android", browser: "edge" };
    if (/Firefox/.test(ua) && !/Chrome/.test(ua)) return { os: "android", browser: "firefox" };
    if (/Kiwi/.test(ua))   return { os: "android", browser: "kiwi" };
    if (/Brave/.test(ua))  return { os: "android", browser: "brave" };
    if (/Chrome/.test(ua)) return { os: "android", browser: "chrome" };
    return { os: "android", browser: "other" };
  }
  if (/Edg\//.test(ua))   return { os: "desktop", browser: "edge" };
  if (/Chrome/.test(ua))  return { os: "desktop", browser: "chrome" };
  if (/Safari/.test(ua))  return { os: "desktop", browser: "safari" };
  if (/Firefox/.test(ua)) return { os: "desktop", browser: "firefox" };
  return { os: "desktop", browser: "other" };
}

    if (/Firefox/.test(ua) && !/Chrome/.test(ua)) return { os: "android", browser: "firefox" };
    if (/Kiwi/.test(ua))   return { os: "android", browser: "kiwi" };
    if (/Brave/.test(ua))  return { os: "android", browser: "brave" };
    if (/UCBrowser/.test(ua)) return { os: "android", browser: "uc" };
    if (/Chrome/.test(ua)) return { os: "android", browser: "chrome" };
    return { os: "android", browser: "other" };
  }
  // Desktop
  if (/Edg\//.test(ua))       return { os: "desktop", browser: "edge" };
  if (/Chrome/.test(ua))      return { os: "desktop", browser: "chrome" };
  if (/Safari/.test(ua))      return { os: "desktop", browser: "safari" };
  if (/Firefox/.test(ua))     return { os: "desktop", browser: "firefox" };
  return { os: "desktop", browser: "other" };
}

function setupInstallBanner() {
  const platform = detectPlatform();

  if (platform === "ios-safari") {
    installTitle.textContent = "添加到主屏幕";
    installDesc.textContent = "点击分享 → 添加到主屏幕，像 App 一样打开";
    installBtn.textContent = "查看教程";
    installBtn.classList.add("ios-guide");
    installBtn.addEventListener("click", () => {
      const tip = document.createElement("div");
      tip.style.cssText = "position:fixed;bottom:0;left:0;right:0;z-index:200;background:rgba(0,0,0,.92);color:#fff;padding:24px;text-align:center;font-size:15px;line-height:1.8;border-radius:20px 20px 0 0;";
      tip.innerHTML = '<div style="font-size:40px;margin-bottom:12px;">📱</div>' +
        '<div style="font-weight:600;margin-bottom:8px;">添加到主屏幕</div>' +
        '<div style="color:rgba(255,255,255,.6);font-size:13px;">点击 Safari 底部的 <b>分享按钮</b><br>然后选择 <b>「添加到主屏幕」</b><br>最后点击 <b>「添加」</b> 即可</div>' +
        '<button style="margin-top:16px;padding:10px 40px;border-radius:20px;border:none;background:rgba(255,255,255,.15);color:#fff;font-size:14px;cursor:pointer;" onclick="this.parentElement.remove()">我知道了</button>';
      document.body.appendChild(tip);
    });
    installBanner.classList.remove("dismissed");
  } else if (platform === "android-chrome" || platform === "desktop") {
    installTitle.textContent = "安装为独立 App";
    installDesc.textContent = "无浏览器边框，桌面直接打开";
    installBtn.textContent = "安装";
    installBanner.classList.remove("dismissed");
  } else {
    installBanner.classList.add("dismissed");
  }
}

// 捕获 Chrome/Edge 原生安装事件
window.addEventListener("beforeinstallprompt", function (e) {
  e.preventDefault();
  deferredPrompt = e;
  installBanner.classList.remove("dismissed");
  installTitle.textContent = "安装为独立 App";
  installDesc.textContent = "一键安装到桌面，像原生应用一样打开";
  installBtn.textContent = "立即安装";
  installBtn.classList.remove("ios-guide");
});

installBtn.addEventListener("click", async function () {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    var result = await deferredPrompt.userChoice;
    if (result.outcome === "accepted") {
      installBanner.classList.add("dismissed");
    }
    deferredPrompt = null;
  }
});

// =============================================
// 启动流程
// =============================================
(function init() {
  // 呼吸灯动画
  var style = document.createElement("style");
  style.textContent = [
    "@keyframes pulse-glow {",
    "  0%, 100% { box-shadow: 0 4px 12px rgba(0,0,0,.35); }",
    "  50% { box-shadow: 0 4px 24px rgba(255,107,166,.5), 0 0 40px rgba(255,107,166,.2); }",
    "}",
    ".app-icon.bubble { animation: pulse-glow 2s ease-in-out infinite; }"
  ].join("\n");
  document.head.appendChild(style);

  // 安装引导
  setupInstallBanner();
  setupGlobalInstallBar();

  // 检查是否有已保存的偶像资料
  var profile = loadProfile();
  if (profile && profile.stageName) {
    fillForm(profile);
    enterPhone();
  } else {
    showSetupScreen(false);
  }
})();

  </script>
